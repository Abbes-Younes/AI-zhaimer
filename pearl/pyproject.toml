[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-audit"
version = "0.1.0"
description = "Phase 0 audit for PEARL-Neuro EEG classification project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "requests>=2.28",
    "jinja2>=3.1",
    # pearl_preproc (Phase 1) runtime deps — previously undeclared even
    # though the pipeline hard-requires all three. download.py uses
    # `requests` against OpenNeuro's HTTPS endpoints, not boto3/awscli.
    "mne>=1.6",
    "mne-icalabel>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pearl-audit = "pearl_audit.cli:main"
pearl-preproc = "pearl_preproc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
