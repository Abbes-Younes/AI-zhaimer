[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-audit"
version = "0.1.0"
description = "Phase 0 audit for PEARL-Neuro EEG classification project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly, not floored, as of phase_4.md Task C (2026-08-11) --
    # a reproducibility claim that floats on `mne>=1.6` is not a
    # reproducibility claim. Versions are the ones actually used to produce
    # every reported number in this project; see reports/provenance_chain.md.
    "pandas==3.0.5",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "jinja2==3.1.6",
    # pearl_preproc (Phase 1) runtime deps — previously undeclared even
    # though the pipeline hard-requires all three. download.py uses
    # `requests` against OpenNeuro's HTTPS endpoints, not boto3/awscli.
    "mne==1.12.1",
    "mne-icalabel==0.9.0",
    # mne-icalabel's ICLabel network requires a torch or onnxruntime backend
    # to actually run -- previously present on the host by accident (never
    # declared), so pearl_preproc's ICA labeling silently worked in dev but
    # failed in a container built strictly from pyproject.toml (phase_4.md
    # Task D, found via the real container smoke test). onnxruntime chosen
    # over torch: same ICLabel result, far lighter (no torchvision/audio).
    "onnxruntime==1.27.0",
    # pearl_features (Phase 2) runtime deps.
    "scikit-learn==1.9.0",
    "PyWavelets==1.9.0",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[project.scripts]
pearl-audit = "pearl_audit.cli:main"
pearl-preproc = "pearl_preproc.cli:main"
pearl-features = "pearl_features.cli:main"
pearl-models = "pearl_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
